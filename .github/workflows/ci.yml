name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, sqlite3, pdo_sqlite, mbstring, intl
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      # Dua ujian memuatkan layouts/app.blade.php, yang memanggil @vite.
      # Tanpa manifest, Blade membuang pengecualian dan ujian gagal atas sebab
      # yang tiada kaitan dengan apa yang diuji.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build assets
        run: npm ci && npm run build

      - name: Test
        run: php artisan test
